<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf8" />
    <title>家庭记账本 · Family Ledger</title>
    <meta
      name="description"
      content="两个人的账，各自记，随时合。A two-person ledger: each records their own, merged whenever you want."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="记账本" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23b4471f'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E%E8%AE%B0%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!-- 登录 / 注册 -->
    <section id="authScreen" class="auth">
      <div class="auth__inner">
        <div class="auth__brand">
          <span class="auth__logo">记</span>
          <div>
            <h1>家庭记账本</h1>
            <p class="muted">各自记自己的，随时合起来看</p>
          </div>
        </div>

        <form id="authForm" class="auth__form" autocomplete="on">
          <label class="field">
            <span>用户名</span>
            <input
              id="username"
              name="username"
              type="text"
              inputmode="latin"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              placeholder="比如 lin"
              required
            />
          </label>

          <label class="field">
            <span>密码</span>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="至少 8 位"
              minlength="8"
              required
            />
          </label>

          <label class="field" id="displayNameField" hidden>
            <span>怎么称呼你</span>
            <input id="displayName" type="text" maxlength="24" placeholder="比如 小林" />
          </label>

          <p id="authError" class="error" role="alert" hidden></p>

          <button id="authSubmit" class="btn btn--primary" type="submit" disabled>
            <span id="authSubmitText">登录</span>
          </button>

          <p class="auth__switch">
            <span id="authSwitchText">还没有账号？</span>
            <button type="button" id="authSwitch" class="link">注册一个</button>
          </p>
        </form>

        <p class="auth__note muted">
          密码不会离开这台设备：浏览器先把密码拉伸 60 万次，服务器只见结果。
          <br />
          <span class="en">Your password never leaves this device.</span>
        </p>
      </div>
    </section>

    <!-- 主应用 -->
    <div id="appScreen" class="app" hidden>
      <header class="topbar">
        <button id="monthPrev" class="icon-btn" aria-label="上个月">‹</button>
        <button id="monthLabel" class="topbar__month"></button>
        <button id="monthNext" class="icon-btn" aria-label="下个月">›</button>
        <button id="scopeToggle" class="chip" title="切换 只看我 / 全家"></button>
      </header>

      <main id="view" class="view"></main>

      <nav class="tabbar" role="tablist">
        <button class="tab" data-view="add" role="tab">
          <span class="tab__icon">＋</span><span>记一笔</span>
        </button>
        <button class="tab" data-view="list" role="tab">
          <span class="tab__icon">☰</span><span>明细</span>
        </button>
        <button class="tab" data-view="stats" role="tab">
          <span class="tab__icon">◔</span><span>统计</span>
        </button>
        <button class="tab" data-view="me" role="tab">
          <span class="tab__icon">◍</span><span>我的</span>
        </button>
      </nav>
    </div>

    <div id="toast" class="toast" hidden></div>
    <div id="modal" class="modal" hidden></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
